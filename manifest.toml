#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "conferencias-mumble"
name = "Conferencias"
description.en = "Ultra-lightweight voice & moderated 9-seat conferencing with its own reliable voice protocol over HTTPS/443 for slow mobile connections"
description.es = "Plataforma ultraligera de conferencias con 9 asientos moderados, protocolo de voz propio confiable, pizarra y cámara ligera por HTTPS/443"

version = "2.1.2~ynh1"

maintainers = ["discapacidad5"]

[upstream]
license = "MIT"
code = "https://github.com/discapacidad5/conferencias-mumble"
admindoc = "https://github.com/discapacidad5/conferencias-mumble/blob/main/README.md"
userdoc = "https://github.com/discapacidad5/conferencias-mumble/blob/main/README.md"

[integration]
yunohost = ">= 11.2.8"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = true
ldap = false
sso = false
disk = "200M"
ram.build = "512M"
ram.runtime = "64M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.admin]
    type = "user"

    [install.password]
    ask.en = "Administrator password for the conferencing panel"
    ask.es = "Contraseña del panel de administración de salas"
    help.en = "Used to log in to the room management panel (minimum 4 characters)."
    help.es = "Se usa para entrar al panel de creación y administración de salas (mínimo 4 caracteres)."
    type = "password"

[resources]
    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]
    subdirs = ["docs"]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 3000

    [resources.apt]
    packages = [
        "git",
        "curl",
        "ca-certificates"
    ]

    [resources.go]
    version = "1.24"
